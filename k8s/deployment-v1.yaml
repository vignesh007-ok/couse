apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-app-v1
  labels:
    app: movie-app-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-app-v1
  template:
    metadata:
      labels:
        app: movie-app-v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: movie-app
          image: vigneshvicky1852007/movie-app:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE
              value: /app/instance/movies.sqlite3
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: movie-data
              mountPath: /app/instance
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: movie-data
          emptyDir: {}
