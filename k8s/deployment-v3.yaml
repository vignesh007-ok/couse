apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-app-v3
  labels:
    app: movie-app-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-app-v3
  template:
    metadata:
      labels:
        app: movie-app-v3
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: movie-app
          image: vigneshvicky1852007/movie-app:v3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
